# The Grantry C++ SDK on every platform it ships for, against the live API.
name: C++ SDK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      # macOS ships libcurl but only LibreSSL without headers, so OpenSSL comes from Homebrew.
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGRANTRY_BUILD_TESTS=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/stage"
          ${OPENSSL_ROOT_DIR:+-DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR}

      - name: Build
        run: cmake --build build --config Release --parallel

      # GRANTRY_LIVE_TESTS: three public requests (17 October 2026). The built-in pins are Let's
      # Encrypt's roots, enforced by each platform's TLS stack differently -- WinHTTP's chain, and
      # libcurl limited to those roots as its whole trust store -- so each runner proves its own
      # stack reaches api.grantry.dev with them and refuses another authority's valid certificate.
      - name: Test
        env:
          GRANTRY_LIVE_TESTS: '1'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release

      # A project outside the repository that finds the installed package, as a user's would.
      - name: Consumer via find_package
        shell: bash
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)
          project(consumer CXX)
          find_package(grantry 0.1 CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE grantry::grantry)
          CMAKE
          cat > consumer/main.cpp <<'CPP'
          #include <grantry/grantry.hpp>
          #include <iostream>
          int main() { std::cout << grantry::Version() << std::endl; return 0; }
          CPP
          cmake -S consumer -B consumer/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/stage" \
            ${OPENSSL_ROOT_DIR:+-DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR}
          cmake --build consumer/build --config Release
